# HTTP → HTTPS redirect
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea-ingress-http
  namespace: gitea
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: gitea-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: git.gabouchieno.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitea
                port:
                  number: 80
---
# HTTPS with TLS termination
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea-ingress-https
  namespace: gitea
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: git.gabouchieno.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitea
                port:
                  number: 80
  tls:
    - hosts:
        - git.gabouchieno.com
      secretName: gitea-tls
