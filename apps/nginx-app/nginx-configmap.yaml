apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-html
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>Ryan's Kubernetes App</title>
    </head>
    <body style="background:black;color:white;">
      <h1>🚀 My First Real App on K3s</h1>
      <p>This page is served by nginx inside Kubernetes.</p>
      <p><strong>Served from node:</strong> ${NODE_NAME}</p>
    </body>
    </html>

kind: ConfigMap
metadata:
  name: nginx-html
