apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  namespace: outline
  annotations:
    "helm.sh/hook": post-install
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command: ["sh", "-c", "until wget -q -O- http://minio:9000/minio/health/ready; do echo waiting for minio; sleep 5; done"]
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-11-17T19-35-25Z
          command:
            - /bin/sh
            - -c
            - |
              mc alias set local http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD
              mc mb --ignore-existing local/outline-files
              mc anonymous set download local/outline-files
              echo "Bucket outline-files ready"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
