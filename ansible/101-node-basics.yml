---
- name: Basic node verification
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Show hostname
      command: hostname
      register: hostname_out

    - name: Show hostname output
      debug:
        msg: "Hostname: {{ hostname_out.stdout }}"

    - name: Show OS version
      command: lsb_release -d
      register: os_out

    - name: Show OS output
      debug:
        msg: "{{ os_out.stdout }}"

    - name: Show uptime
      command: uptime
      register: uptime_out

    - name: Show uptime output
      debug:
        msg: "{{ uptime_out.stdout }}"
